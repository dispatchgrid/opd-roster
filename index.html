<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPD Roster</title>
<script>try{var t=localStorage.getItem('opd_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2312695E'/%3E%3Crect x='6' y='8' width='20' height='2.5' fill='white'/%3E%3Crect x='6' y='14' width='20' height='2.5' fill='white'/%3E%3Crect x='6' y='20' width='13' height='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/today">
    <span class="brand-name" id="brand-name">OPD Unit</span>
    <span class="brand-hospital" id="brand-hospital"></span>
  </a>
  <nav class="topbar-actions">
    <button id="btn-legend" class="btn ghost icon-btn" aria-label="Doctor legend" title="Doctor letters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M8 6h12M8 12h12M8 18h12"/>
        <circle cx="4" cy="6" r="1.25" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="12" r="1.25" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="18" r="1.25" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button id="btn-theme" class="btn ghost icon-btn" aria-label="Switch colour theme" title="Theme">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/>
      </svg>
    </button>
    <button id="btn-login" class="btn ghost icon-btn" hidden aria-label="Log in" title="Log in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/>
        <path d="M10 17l5-5-5-5M15 12H3"/>
      </svg>
    </button>
    <button id="btn-admin-menu" class="btn ghost icon-btn" hidden aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
  </nav>
</header>
<nav class="tabs" id="tabs" aria-label="Views">
  <a class="tab" data-tab="today" href="#/today">Today's duty</a>
  <a class="tab" data-tab="grid" href="#/grid">Full grid</a>
</nav>
<div class="sync-strip" id="sync-strip" role="status">
  <span class="dot"></span><span id="sync-text"></span>
</div>
<main id="view" class="view" aria-live="polite"></main>
<footer class="foot">
  <div>Software Developed by</div>
  <div class="credit">Nethmal Sooriyabandara &copy; 2026</div>
</footer>
<div id="modal-root"></div>
<script src="app.js?v=13"></script>
</body>
</html>
